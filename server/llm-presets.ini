; llm-presets.ini - llama-server router 모드 모델 목록 (llm-router.sh 가 사용)
;
; 주의: model / model-draft / mmproj 경로(/mnt/data/.../gguf-work/...)는 이 서버의 실제 경로다.
;       다른 장비에서 쓰려면 모델을 받아(server/models.tsv 참고) 경로를 자기 것으로 바꿔야 한다.
;
; 형식: [*] = 모든 모델 공통 / [이름] = 모델별(공통 값을 덮어쓴다). 키는 llama-server 의 CLI 긴 이름에서 `--` 를 뺀 것.
;       요청 JSON 의 "model" 이 [이름] 과 같으면 그 모델로 라우팅한다. --models-max 1 이면 바꿀 때 자동 교체(대체로 17~30초).
; 실행기 : llama.cpp b11539 (2026-10-09, Vulkan) - 공식 사전빌드
; 모델 머리 주석 형식: 모델 / 출처(공개일·라이선스) / 양자화·크기·sha256 / 가속·비고 / 실측
version = 1

[*]
n-gpu-layers = 999
flash-attn = on
jinja = true
c = 65536
load-mode = none

; -- cn ---------------------------------------------------------------
; 모델   : Qwen3-Coder-Next 80B-A3B (Qwen, 코딩 전용 MoE)
; 출처   : huggingface.co/bartowski/Qwen_Qwen3-Coder-Next-GGUF (2026-02-03, Apache-2.0)
; 양자화 : Q4_K_M · 48.7GB · sha256 78f38fe85daaab51… (2026-10-10 받음·HF 공개값 대조)
; 가속   : 없음 - 이 GGUF 엔 MTP 층 없음(헤더 확인)
; 실측   : 생성 45~49 t/s · 읽기 550~750 t/s · 테트리스 실전 4분, 보드 크기 버그(10-14)
[cn]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/Qwen_Qwen3-Coder-Next-Q4_K_M.gguf
load-on-startup = true

; -- q36 --------------------------------------------------------------
; 모델   : Qwen3.6-35B-A3B (Qwen, MoE 3B 활성)
; 출처   : huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF (2026-05-11, Apache-2.0)
; 양자화 : UD-Q6_K · 30.0GB · sha256 49935b04ad883c2f… (2026-10-11 받음·검증)
; 가속   : MTP(draft-mtp) · 생각은 서버에서 끈다
; 실측   : 생성 71~86 t/s · 읽기 680~900 t/s · 테트리스 실전 5분34초 5/5(10-14)
[q36]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/qwen36-35b/Qwen3.6-35B-A3B-UD-Q6_K.gguf
spec-type = draft-mtp
chat-template-kwargs = {"enable_thinking":false}

; -- mg ---------------------------------------------------------------
; 모델   : Muse Glimmer 30B (Meta, dense) + DFlash 초안모델
; 출처   : huggingface.co/meta-models/Muse-Glimmer-30B-GGUF (2026-08-09, Apache-2.0)
; 양자화 : KQuant-Dynamic Q4_K_XL · 19.7GB · sha256 ac7023d6a4c704eb… (2026-10-11 받음·검증)
;          초안 dflash Q4_K_M · 1.6GB · sha256 b2e808bf656086fe…
; 가속   : DFlash · 생각 강도는 opencode variant(low/xhigh)로 요청마다 지정
; 실측   : 생성 20~30 t/s · 읽기 220~310 t/s · 테트리스 실전(xhigh) 18분14초, 품질 최고(10-14)
[mg]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/glimmer/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
model-draft = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/glimmer/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
spec-type = draft-dflash
; 초안 길이 실측(10-11): 3≈6 > 10·16 (수락률 급락으로 오히려 느려짐)
spec-draft-n-max = 6

; -- orn --------------------------------------------------------------
; 모델   : Ornith-1.5-35B-A3B (ornith-ai, Qwen3.5/Gemma4 기반 자가개선 RL, MoE 3B 활성, 추론 모델)
; 출처   : huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-GGUF (2026-08-18, MIT)
; 양자화 : Q6_K · 29.2GB · sha256 15d4658bbfc9c603… (2026-10-15 받음·HF 공개값 대조)
; 가속   : MTP(draft-mtp, 헤더에 nextn 층 확인) · 생각은 서버에서 끈다(벤치 점수는 생각 켠 값)
; 샘플링 : 모델 카드 권장값 temperature 0.6 · top_p 0.95 · top_k 20
[orn]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/ornith/Ornith-1.5-35B-Q6_K.gguf
spec-type = draft-mtp
chat-template-kwargs = {"enable_thinking":false}
temp = 0.6
top-p = 0.95
top-k = 20

; -- fn ---------------------------------------------------------------
; 모델   : Qwen3.8-Flash-Next GSQ-RCO Coder (Qwen 원본 2026-08-24 · IST-DASLab 압축, 512 전문가 중 절반 제거·코딩용 선별, 이미지 가능)
; 출처   : huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF (2026-09-26, Apache-2.0)
; 양자화 : IQ1_M(유효 1.89bit) · 58.4GB = 2조각 · sha256 e11083ba855e7666… / 316b46f3a2dbd68c… (2026-10-11 받음, 10-17 재검증)
; 메모리 : 58.4GB 중 28.8GB 가 per_layer_token_embd 한 텐서 → CPU 에 두고 mmap 으로 필요한 줄만 읽는다 → GPU 약 30GB
; 실측   : 10-11 벤치(생각 켬=0바이트, 생각 끔+temp 0.2=「Malayalam」 반복 붕괴) · 이번엔 Qwen 권장 비생각 샘플링 + presence 1.5
[fn]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/flashnext/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
load-mode = mmap
override-tensor = per_layer_token_embd=CPU
chat-template-kwargs = {"enable_thinking":false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
presence-penalty = 1.5

; -- mel ---------------------------------------------------------------
; 모델   : Mellum2.1-12B-A2.5B-Thinking (JetBrains, 코딩 에이전트용 MoE · 64 전문가 중 8개 · 생각 모델)
; 출처   : huggingface.co/JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF (2026-10-07, Apache-2.0)
; 양자화 : Q8_0 · 12.9GB · sha256 69e0ac02a16586c2… (2026-10-17 받음·HF 공개값 대조)
; 가속   : 없음 · 생각은 늘 켜짐(Thinking 판) · 문맥 131K 지원(서버는 64K)
; 샘플링 : 카드 권장 temperature 0.6 · top_p 0.95 · top_k 20
; 실측   : 표준 시험(10-17) 생성 84.7 t/s · 읽기 2008 t/s · GTT 13.3G · 교체 포함 첫 응답 19.8초 · 정답 대조 통과 (실전 과제 미실시)
[mel]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/mellum21/Mellum2.1-12B-A2.5B-Thinking-Q8_0.gguf
temp = 0.6
top-p = 0.95
top-k = 20

; ====================================================================
; 아래 3개(bolt · lfm · mcv)는 「추가 중 - 실측 전」 이다.
;  - 모델 파일을 받는 중이다. 받은 뒤 sha256sum 으로 대조하고(models.tsv), 속도·GTT·품질을 재서 머리 주석의 「실측」을 채울 것.
;  - 파일이 없는 장비에서는 이 섹션들을 지우거나 주석 처리한다.
; ====================================================================

; -- bolt (추가 중 - 실측 전) -------------------------------------------
; 모델   : NVIDIA Nemotron 3.5 Bolt 74B-A9B 24GB (Mamba-2·Transformer 혼합 LatentMoE · 9B 활성 · 이미지/영상 입력)
; 출처   : huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF (2026-10-07, OpenMDW-1.1)
;          초안 huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr-GGUF (2026-10-12)
; 양자화 : 공식 2비트 QAT(IQ2) · 22.0GB + mmproj 1.7GB + LiLiCorr 초안 1.0GB
;          sha256 91d63363e782c8a3… / 0ee891eadc7bf0ca… / 080e1ea41c9562a7… (받는 중 · 값은 HF 공개값, 받은 뒤 대조)
; 가속   : DFlash(초안 6토큰, NVIDIA 레시피) · KV q8_0 · 「로컬 에이전트·도구 호출·터미널」용으로 학습
; 샘플링 : 카드 권장 temperature 1.0 · top_p 0.95
; 실측   : (아직 안 쟀다)
[bolt]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/nemotron-bolt/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
mmproj = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/nemotron-bolt/mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
model-draft = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/nemotron-bolt/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
spec-draft-ngl = 999
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95

