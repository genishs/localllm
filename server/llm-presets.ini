; llm-presets.ini - llama-server router 모드 모델 목록 (llm-router.sh 가 사용)
;
; 주의: model / model-draft / mmproj 경로(/mnt/data/.../gguf-work/...)는 이 서버의 실제 경로다.
;       다른 장비에서 쓰려면 모델을 받아(server/models.tsv 참고) 경로를 자기 것으로 바꿔야 한다.
;
; 형식: [*] = 모든 모델 공통 / [이름] = 모델별(공통 값을 덮어쓴다). 키는 llama-server 의 CLI 긴 이름에서 `--` 를 뺀 것.
;       요청 JSON 의 "model" 이 [이름] 과 같으면 그 모델로 라우팅한다. --models-max 1 이면 바꿀 때 자동 교체(대체로 17~30초).
; 실행기 : llama.cpp b11701 (2026-10-16, Vulkan) - 공식 사전빌드. bolt(Nemotron 3.5 Bolt)와 mcv(MiniCPM-V 4.7)는 b11701 이상이 필요하다(b11539 는 못 읽는다)
; 모델 머리 주석 형식: 모델 / 출처(공개일·라이선스) / 양자화·크기·sha256 / 가속·비고 / 실측
;
; 구성: cn q36 mg orn mel bolt = 일반 사용 후보 / fn q38 aw ff c7 c7r c1 = 실험·비교·기준선용 / lfm mcv = 추가 중
version = 1

[*]
n-gpu-layers = 999
flash-attn = on
jinja = true
c = 65536
load-mode = none

; -- cn ---------------------------------------------------------------
; 모델   : Qwen3-Coder-Next 80B-A3B (Qwen, 코딩 전용 MoE)
; 출처   : huggingface.co/bartowski/Qwen_Qwen3-Coder-Next-GGUF (2026-02-03, Apache-2.0)
; 양자화 : Q4_K_M · 48.7GB · sha256 78f38fe85daaab51… (2026-10-10 받음·HF 공개값 대조)
; 가속   : 없음 - 이 GGUF 엔 MTP 층 없음(헤더 확인)
; 실측   : 생성 45~49 t/s · 읽기 550~750 t/s · 테트리스 실전 4분, 보드 크기 버그(10-14)
[cn]
model = /mnt/data/Documents/workspace/study/_llamacpp_toolchain/gguf-work/Qwen_Qwen3-Coder-Next-Q4_K_M.gguf
load-on-startup = true

