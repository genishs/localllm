; ====================================================================
; 아래 2개(lfm · mcv)는 「추가 중 — 실측 전」 이다.
;  - 모델 파일을 받는 중이다. 받은 뒤 sha256sum 으로 대조하고(models.tsv), 속도·GTT·품질을 재서 머리 주석의 「실측」을 채울 것.
;  - mcv 는 llama.cpp b11701 이상이 필요하다(PR #29416, 10-10 병합).
;  - 파일이 없는 장비에서는 이 섹션들을 지우거나 주석 처리한다.
